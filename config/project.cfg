# =====================================================================
#  project.cfg - describes WHAT to build. All scripts read this file.
#  Format:  key = value      ('#' starts a comment)
#  Windows: any  KEY_windows = value  overrides KEY when run on Windows
#           (e.g. port_windows = COM3), so one config works on both OSes.
#  Your Vitis install path lives in config/vitis.env, not here.
# =====================================================================

[platform]
name = hw_platform
# XSA exported from Vivado (File > Export > Export Hardware, include bitstream).
# auto = use the only .xsa file in hw/.  Or give a path, e.g. hw/design_1_wrapper.xsa
xsa  = auto

# ---------------------------------------------------------------------
# Domains: one [domain NAME] section per processor + OS (one BSP each).
# Run scripts/xsa_info.sh to list the processor names in your XSA.
#   Zynq-7000:   ps7_cortexa9_0, ps7_cortexa9_1
#   ZynqMP:      psu_cortexa53_0..3, psu_cortexr5_0..1
#   MicroBlaze:  microblaze_0
# Single core = one domain.  AMP = one domain per core (example below).
# ---------------------------------------------------------------------
[domain core0]
proc = ps7_cortexa9_0
os   = standalone           # standalone | freertos10_xilinx
# arch = 64-bit             # ZynqMP A53 only: 64-bit (default) | 32-bit
# libs = xilffs             # BSP libraries, space separated (bsp setlib)
# bsp.stdout = ps7_uart_1   # any BSP setting:  bsp.<param> = <value>
# bsp.stdin  = ps7_uart_1   # use ps7_coresight_comp_0 to print over JTAG UART

# Second core for AMP (uncomment and add an [app] that uses it):
# [domain core1]
# proc = ps7_cortexa9_1
# os   = standalone

# ---------------------------------------------------------------------
# Applications: one [app NAME] section each. Sources live in src/NAME/.
# The first build copies the template into src/NAME/ if it is empty;
# after that src/NAME/ is yours and the template is not used again.
# ---------------------------------------------------------------------
[app hello]
domain   = core0
template = Hello World      # Hello World | Empty Application(C) | Memory Tests | Peripheral Tests | ...
lang     = c                # c | c++
build    = Debug            # Debug | Release
# defines = MY_FLAG BAUD=115200   # -D symbols   (applied when the app project is created;
# libs    = m                     # link libs     run build_app.sh --clean after changing)

[boot]
apps      = hello           # ELF(s) to put in BOOT.BIN, in order
bitstream = yes             # include the bitstream from the XSA

[flash]
method     = jtag           # jtag = program flash over JTAG | sd = copy BOOT.BIN to an SD card
flash_type = qspi-x4-single # qspi-x4-single | qspi-x4-dual_stacked | qspi-x8-dual_parallel |
                            # nand-x8 | nand-x16 | nor-x8 | nor-x16 | emmc
offset     = 0
verify     = yes
sd_path    = /media/user/BOOT   # mounted SD card boot partition (method = sd)
sd_path_windows = E:/
# extra_args = -blank_check     # passed to program_flash as-is

[jtag]
# hw_server = TCP:192.168.1.10:3121   # remote hw_server; leave unset for local (auto-started)
# cable     = 210279A42B5D            # part of the cable serial, if several boards are plugged in

[debug]
app          = hello        # default app for debug.sh / jtag_uart.sh
program_fpga = yes          # program the bitstream before loading the app

[uart]
port         = /dev/ttyUSB1
port_windows = COM3         # see Device Manager > Ports (COM & LPT)
baud         = 115200
